services:
  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./web:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sqli_lab
      MYSQL_USER: labuser
      MYSQL_PASSWORD: labpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sqli_db.sql:/docker-entrypoint-initdb.d/sqli_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
